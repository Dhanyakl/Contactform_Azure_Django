<!doctype html>
<html>
  <head>
    <title>Contact Form</title>

    <style>
      .form-container {
        width: 400px;
        margin: 80px auto;
        padding: 30px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background: #f9f9f9;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input,
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #aaa;
        border-radius: 5px;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %} {% for field in form %}
        <div class="form-group">
          <label>{{ field.label }}</label>
          {{ field }}
        </div>
        {% endfor %}

        <button type="submit">Save</button>
      </form>
    </div>
  </body>
</html>
